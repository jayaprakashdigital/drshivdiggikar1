\">\n          <span class=\"stars-lg\">★★★★★<\u002Fspan>\n          <span class=\"rating-text\">4.9 · Whitefield, ITPL, Kadugodi &amp; nearby<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"carousel-wrapper\">\n        <div class=\"carousel\" id=\"carousel\">\n          <div class=\"testimonial-card active\">\n            <div class=\"tcard-inner\">\n              <div class=\"tcard-quote\">“<\u002Fdiv>\n              <div class=\"tcard-stars\">★★★★★<\u002Fdiv>\n              <div class=\"tcard-headline\">Finally, a world-class pediatrician right in Whitefield.<\u002Fdiv>\n              <p class=\"tcard-text\">We used to drive all the way to Koramangala for our daughter's pediatrician. After we found Dr. Diggikar at Medicover Whitefield, those long drives are over. His UK training and experience show in every consultation. He's now our family's go-to doctor for both our kids.<\u002Fp>\n              <div class=\"tcard-author\">\n                <div class=\"tcard-avatar\">AK<\u002Fdiv>\n                <div>\n                  <div class=\"tcard-author-name\">Anjali &amp; Karthik<\u002Fdiv>\n                  <div class=\"tcard-author-loc\">Whitefield · near Forum Mall<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"testimonial-card\">\n            <div class=\"tcard-inner\">\n              <div class=\"tcard-quote\">“<\u002Fdiv>\n              <div class=\"tcard-stars\">★★★★★<\u002Fdiv>\n              <div class=\"tcard-headline\">Top pediatrician near ITPL — no contest.<\u002Fdiv>\n              <p class=\"tcard-text\">As working parents at ITPL, we needed a pediatrician close to work for emergencies. Dr. Diggikar at Medicover Whitefield is just 10 minutes away. He's handled everything from our son's vaccinations to a scary high fever episode at 2 months old. Can't recommend him enough.<\u002Fp>\n              <div class=\"tcard-author\">\n                <div class=\"tcard-avatar\">PR<\u002Fdiv>\n                <div>\n                  <div class=\"tcard-author-name\">Priya R.<\u002Fdiv>\n                  <div class=\"tcard-author-loc\">ITPL<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"testimonial-card\">\n            <div class=\"tcard-inner\">\n              <div class=\"tcard-quote\">“<\u002Fdiv>\n              <div class=\"tcard-stars\">★★★★★<\u002Fdiv>\n              <div class=\"tcard-headline\">Our Kadugodi neighborhood's most trusted children's doctor.<\u002Fdiv>\n              <p class=\"tcard-text\">Everyone in our apartment complex in Kadugodi takes their kids to Dr. Diggikar. His NICU expertise saved our neighbor's premature twins, and he's been our son's pediatrician since birth. We drive 15 minutes to Medicover Whitefield every time — worth it.<\u002Fp>\n              <div class=\"tcard-author\">\n                <div class=\"tcard-avatar\">RM<\u002Fdiv>\n                <div>\n                  <div class=\"tcard-author-name\">Rohan M.<\u002Fdiv>\n                  <div class=\"tcard-author-loc\">Kadugodi<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"testimonial-card\">\n            <div class=\"tcard-inner\">\n              <div class=\"tcard-quote\">“<\u002Fdiv>\n              <div class=\"tcard-stars\">★★★★★<\u002Fdiv>\n              <div class=\"tcard-headline\">Asthma management expert — our daughter breathes easier now.<\u002Fdiv>\n              <p class=\"tcard-text\">Our 7-year-old has severe asthma triggered by Bangalore's pollution. Dr. Diggikar created a detailed action plan, taught us proper inhaler technique, and her emergency visits dropped to zero. We live in Varthur and drive to Whitefield specifically to see him.<\u002Fp>\n              <div class=\"tcard-author\">\n                <div class=\"tcard-avatar\">DS<\u002Fdiv>\n                <div>\n                  <div class=\"tcard-author-name\">Deepak S.<\u002Fdiv>\n                  <div class=\"tcard-author-loc\">Varthur<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"testimonial-card\">\n            <div class=\"tcard-inner\">\n              <div class=\"tcard-quote\">“<\u002Fdiv>\n              <div class=\"tcard-stars\">★★★★★<\u002Fdiv>\n              <div class=\"tcard-headline\">No more rushing across Bangalore for pediatric emergencies.<\u002Fdiv>\n              <p class=\"tcard-text\">Having a London-trained neonatologist and pediatrician right here in Whitefield gives us so much peace of mind. Dr. Diggikar is available 24/7 at Medicover for emergencies, and his team has handled our twins' illnesses expertly every single time.<\u002Fp>\n              <div class=\"tcard-author\">\n                <div class=\"tcard-avatar\">SA<\u002Fdiv>\n                <div>\n                  <div class=\"tcard-author-name\">Sneha &amp; Arjun<\u002Fdiv>\n                  <div class=\"tcard-author-loc\">Brookefield<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"carousel-nav\">\n          <button class=\"carousel-btn\" id=\"prevBtn\" aria-label=\"Previous testimonial\">‹<\u002Fbutton>\n          <div class=\"carousel-dots\" id=\"carouselDots\"><\u002Fdiv>\n          <button class=\"carousel-btn\" id=\"nextBtn\" aria-label=\"Next testimonial\">›<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ═══ FAQ ════════════════════════════════════════════════ -->\n  <section class=\"faq-section\" id=\"faq\">\n    <div class=\"container\">\n      <div class=\"section-tag\">Frequently Asked<\u002Fdiv>\n      <h2 class=\"section-heading\">Answers for parents in Whitefield, ITPL &amp; nearby.<\u002Fh2>\n\n      <div class=\"faq-layout\">\n        <aside class=\"faq-sidebar\">\n          <div class=\"faq-sidebar-card\">\n            <h3>Have another question?<\u002Fh3>\n            <p>Speak to our team during clinic hours, or call anytime for pediatric emergencies — 24/7 at Medicover Whitefield.<\u002Fp>\n            <a href=\"tel:+919133555335\" class=\"btn btn-white\">\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9a16 16 0 0 0 6 6l1.09-1.09a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z\"><\u002Fpath><\u002Fsvg>\n              +91-9133555335\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Faside>\n\n        <div class=\"faq-list\">\n          <div class=\"faq-item is-open\">\n            <button class=\"faq-question\" aria-expanded=\"true\">\n              <span>Is Dr. Diggikar's clinic located inside Whitefield or do I need to travel far?<\u002Fspan>\n              <span class=\"faq-q-icon\">+<\u002Fspan>\n            <\u002Fbutton>\n            <div class=\"faq-answer open\">\n              <p>Dr. Diggikar practices at Medicover Women &amp; Children Hospital on Whitefield Main Road — right in the heart of Whitefield, 5 minutes from Forum Neighbourhood Mall and 10 minutes from ITPL. Most families from Whitefield, Kadugodi, Varthur, Hoodi, and Brookefield reach the hospital in 10–15 minutes by car. The clinic is well-connected by Whitefield Metro Station (Purple Line), with ample parking available. You do <strong>not<\u002Fstrong> need to travel to Koramangala, Indiranagar, or other parts of Bangalore.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"faq-item\">\n            <button class=\"faq-question\" aria-expanded=\"false\">\n              <span>Can I walk in for consultations or do I need to book an appointment?<\u002Fspan>\n              <span class=\"faq-q-icon\">+<\u002Fspan>\n            <\u002Fbutton>\n            <div class=\"faq-answer\">\n              <p>Walk-in consultations are accepted for sick child visits and urgent concerns during clinic hours (Mon–Sat, 9:30 AM – 2:30 PM). For routine check-ups, vaccinations, and non-urgent consultations, we recommend booking an appointment to avoid wait times. Book online at <a href=\"https://www.medicoverhospitals.in/doctors/dr-shivashankar-diggikar\" target=\"_blank\" rel=\"noopener\">medicoverhospitals.in<\u002Fa> or call <a href=\"tel:+919133555335\">+91-9133555335<\u002Fa>. For pediatric emergencies, go directly to Medicover Whitefield Emergency — 24/7, no appointment needed.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"faq-item\">\n            <button class=\"faq-question\" aria-expanded=\"false\">\n              <span>What age children does Dr. Diggikar treat at Medicover Whitefield?<\u002Fspan>\n              <span class=\"faq-q-icon\">+<\u002Fspan>\n            <\u002Fbutton>\n            <div class=\"faq-answer\">\n              <p>Dr. Diggikar treats children from newborn (day 0) through 18 years (adolescence). As a neonatologist, he specializes in the critical first 28 days of life including NICU care for premature babies. As a pediatrician, he continues caring through infancy, toddler years, school age, and the teenage years. Many Whitefield families have been with Dr. Diggikar since their child's birth.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"faq-item\">\n            <button class=\"faq-question\" aria-expanded=\"false\">\n              <span>Does Dr. Diggikar provide vaccinations at the Whitefield clinic?<\u002Fspan>\n              <span class=\"faq-q-icon\">+<\u002Fspan>\n            <\u002Fbutton>\n            <div class=\"faq-answer\">\n              <p>Yes. Dr. Diggikar follows the Indian Academy of Pediatrics (IAP) 2025 vaccination schedule and provides all mandatory and optional vaccines at Medicover Whitefield. This includes BCG, Hepatitis B, DPT, Polio, MMR, Varicella, Rotavirus, Pneumococcal conjugate, Meningococcal, Typhoid, Influenza, and HPV vaccines. He provides personalized vaccine counseling based on Bangalore-specific disease prevalence and your child's risk factors.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"faq-item\">\n            <button class=\"faq-question\" aria-expanded=\"false\">\n              <span>Is Dr. Diggikar available for pediatric emergencies in Whitefield?<\u002Fspan>\n              <span class=\"faq-q-icon\">+<\u002Fspan>\n            <\u002Fbutton>\n            <div class=\"faq-answer\">\n              <p>Yes. Dr. Diggikar provides 24/7 on-call pediatric emergency consultation at Medicover Whitefield. For emergencies like high fever in infants under 3 months, severe dehydration, breathing difficulty, seizures, head injuries, or poisoning — call <a href=\"tel:+919133555335\">+91-9133555335<\u002Fa> or go directly to Medicover Whitefield Emergency. No need to rush across Bangalore.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"faq-item\">\n            <button class=\"faq-question\" aria-expanded=\"false\">\n              <span>Does Medicover Whitefield accept health insurance for pediatric care?<\u002Fspan>\n              <span class=\"faq-q-icon\">+<\u002Fspan>\n            <\u002Fbutton>\n            <div class=\"faq-answer\">\n              <p>Yes. Medicover Hospitals Whitefield is empaneled with all major health insurance providers including Star Health, HDFC Ergo, ICICI Lombard, Max Bupa, Care Health, Religare, Bajaj Allianz, New India Assurance, and government schemes like Ayushman Bharat and Karnataka Arogya Sanjeevani. Insurance typically covers hospitalization, surgeries, and emergency care; outpatient consultations (OPD) are usually not covered — confirm with your specific policy.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"faq-item\">\n            <button class=\"faq-question\" aria-expanded=\"false\">\n              <span>What makes Dr. Diggikar one of the top pediatricians in Whitefield?<\u002Fspan>\n              <span class=\"faq-q-icon\">+<\u002Fspan>\n            <\u002Fbutton>\n            <div class=\"faq-answer\">\n              <p>Dr. Diggikar is one of the few FRCPCH (UK) and FRCPI (Ireland) certified pediatricians practicing full-time in Whitefield. His London training at Homerton University Hospital, 30+ research publications, Associate Editor role at BMJ Paediatrics Open, and Director-level position at Medicover Whitefield bring international pediatric care standards to your neighborhood. Most pediatricians in Whitefield hold only MBBS or MD Pediatrics — Dr. Diggikar's dual UK/Ireland fellowships and neonatology specialization set him apart significantly.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"faq-item\">\n            <button class=\"faq-question\" aria-expanded=\"false\">\n              <span>Can Dr. Diggikar help with childhood asthma and allergies common in Whitefield?<\u002Fspan>\n              <span class=\"faq-q-icon\">+<\u002Fspan>\n            <\u002Fbutton>\n            <div class=\"faq-answer\">\n              <p>Yes. Dr. Diggikar has extensive experience managing childhood asthma, wheezing, allergic rhinitis, eczema, and food allergies — conditions increasingly common in Whitefield and ITPL areas due to Bangalore's air pollution and construction dust. He creates personalized asthma action plans, teaches proper inhaler/spacer technique to parents, prescribes controller medications when needed, and monitors lung function. Many Whitefield families trust Dr. Diggikar specifically for long-term asthma management.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"faq-item\">\n            <button class=\"faq-question\" aria-expanded=\"false\">\n              <span>Is there parking available at the Whitefield clinic?<\u002Fspan>\n              <span class=\"faq-q-icon\">+<\u002Fspan>\n            <\u002Fbutton>\n            <div class=\"faq-answer\">\n              <p>Yes. Medicover Women &amp; Children Hospital, Whitefield has ample free parking available for patients. The hospital is easily accessible by car with dedicated parking bays. If traveling by auto-rickshaw or metro, the hospital is a short ride from Whitefield Metro Station (Purple Line) and well-known to local auto drivers as \"Medicover Hospital, Whitefield Main Road\".<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"faq-item\">\n            <button class=\"faq-question\" aria-expanded=\"false\">\n              <span>Can I consult Dr. Diggikar for my newborn baby in Whitefield?<\u002Fspan>\n              <span class=\"faq-q-icon\">+<\u002Fspan>\n            <\u002Fbutton>\n            <div class=\"faq-answer\">\n              <p>Absolutely. As a London-trained neonatologist, Dr. Diggikar specializes in newborn care including jaundice management, feeding problems, low birth weight babies, premature infants, and NICU admissions. Many Whitefield families deliver at Medicover Whitefield specifically to have Dr. Diggikar attend the delivery and provide immediate newborn care. If your baby is born elsewhere and you need a newborn specialist in Whitefield, Dr. Diggikar accepts consultations for babies from day one of life.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ═══ FINAL CTA ══════════════════════════════════════════ -->\n  <section class=\"final-cta\" id=\"book\">\n    <div class=\"container\">\n      <div class=\"cta-inner\">\n        <div class=\"section-tag-white\">Book an Appointment<\u002Fdiv>\n        <h2>Expert Pediatric Care Right Here in Whitefield, Bangalore.<\u002Fh2>\n        <p class=\"cta-desc\">No need to travel across Bangalore for UK-certified pediatric expertise. Dr. Shivashankar Diggikar brings FRCPCH (UK), FRCPI (Ireland) training, 15+ years of experience, and London-trained neonatal care right to your neighborhood at Medicover Women &amp; Children Hospital, Whitefield.<\u002Fp>\n\n        <div class=\"cta-btns\">\n          <a href=\"https://www.medicoverhospitals.in/doctors/dr-shivashankar-diggikar\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-white\">\n            <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"><\u002Fline><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"><\u002Fline><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"><\u002Fline><\u002Fsvg>\n            Book Appointment Online\n          <\u002Fa>\n          <a href=\"tel:+919133555335\" class=\"btn btn-ghost\">\n            <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9a16 16 0 0 0 6 6l1.09-1.09a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z\"><\u002Fpath><\u002Fsvg>\n            Call: +91-9133555335\n          <\u002Fa>\n        <\u002Fdiv>\n\n        <div class=\"cta-trust\">\n          <span class=\"cta-trust-item\">\n            <span class=\"cta-trust-icon\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n            Medicover Whitefield, Bangalore\n          <\u002Fspan>\n          <span class=\"cta-trust-item\">\n            <span class=\"cta-trust-icon\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><polyline points=\"12 6 12 12 16 14\"><\u002Fpolyline><\u002Fsvg><\u002Fspan>\n            Mon–Sat, 9:30 AM – 2:30 PM\n          <\u002Fspan>\n          <span class=\"cta-trust-item\">\n            <span class=\"cta-trust-icon\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan>\n            24/7 Pediatric Emergency\n          <\u002Fspan>\n        <\u002Fdiv>\n\n        <p class=\"cta-areas\">Serving families in Whitefield · ITPL · Kadugodi · Varthur · Hoodi · Brookefield · Marathahalli · Channasandra · Nallurhalli · Doddanekkundi.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ═══ STICKY MOBILE CTA ══════════════════════════════════ -->\n  <div class=\"mobile-sticky-cta\" id=\"mobileCta\">\n    <a href=\"tel:+919133555335\" class=\"btn btn-outline-blue\">\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9a16 16 0 0 0 6 6l1.09-1.09a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z\"><\u002Fpath><\u002Fsvg>\n      Call Now\n    <\u002Fa>\n    <a href=\"https://www.medicoverhospitals.in/doctors/dr-shivashankar-diggikar\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-primary\">\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"><\u002Fline><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"><\u002Fline><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"><\u002Fline><\u002Fsvg>\n      Book\n    <\u002Fa>\n  <\u002Fdiv>\n\n  <script>\n// ── FAQ ────────────────────────────────────────────────────\ndocument.querySelectorAll('.faq-question').forEach(btn => {\n  btn.addEventListener('click', () => {\n    const item = btn.closest('.faq-item');\n    const answer = btn.nextElementSibling;\n    const isOpen = item.classList.contains('is-open');\n\n    document.querySelectorAll('.faq-item').forEach(el => {\n      el.classList.remove('is-open');\n      el.querySelector('.faq-question').setAttribute('aria-expanded', 'false');\n      el.querySelector('.faq-answer').classList.remove('open');\n    });\n\n    if (!isOpen) {\n      item.classList.add('is-open');\n      btn.setAttribute('aria-expanded', 'true');\n      answer.classList.add('open');\n    }\n  });\n});\n\n// ── TESTIMONIALS CAROUSEL ──────────────────────────────────\nconst cards = document.querySelectorAll('.testimonial-card');\nconst dotsContainer = document.getElementById('carouselDots');\nlet current = 0;\nlet autoplayTimer;\n\ncards.forEach((_, i) => {\n  const dot = document.createElement('button');\n  dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');\n  dot.setAttribute('aria-label', `Testimonial ${i + 1}`);\n  dot.addEventListener('click', () => goTo(i));\n  dotsContainer?.appendChild(dot);\n});\n\nfunction goTo(index) {\n  cards[current].classList.remove('active');\n  dotsContainer?.querySelectorAll('.carousel-dot')[current]?.classList.remove('active');\n  current = (index + cards.length) % cards.length;\n  cards[current].classList.add('active');\n  dotsContainer?.querySelectorAll('.carousel-dot')[current]?.classList.add('active');\n  resetAutoplay();\n}\n\ndocument.getElementById('prevBtn')?.addEventListener('click', () => goTo(current - 1));\ndocument.getElementById('nextBtn')?.addEventListener('click', () => goTo(current + 1));\n\nfunction startAutoplay() { autoplayTimer = setInterval(() => goTo(current + 1), 6500); }\nfunction resetAutoplay() { clearInterval(autoplayTimer); startAutoplay(); }\nstartAutoplay();\n\n// Touch swipe\nlet touchStartX = 0;\nconst carouselEl = document.getElementById('carousel');\ncarouselEl?.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });\ncarouselEl?.addEventListener('touchend', e => {\n  const diff = touchStartX - e.changedTouches[0].clientX;\n  if (Math.abs(diff) > 50) goTo(diff > 0 ? current + 1 : current - 1);\n});\n\n// ── SCROLL REVEAL ──────────────────────────────────────────\nconst revealObserver = new IntersectionObserver((entries) => {\n  entries.forEach(entry => {\n    if (entry.isIntersecting) {\n      entry.target.classList.add('visible');\n      revealObserver.unobserve(entry.target);\n    }\n  });\n}, { threshold: 0.08 });\n\ndocument.querySelectorAll('.why-card, .svc-card, .location-main-card, .faq-item, .highlight-item, .cred-item').forEach(el => {\n  el.classList.add('reveal');\n  revealObserver.observe(el);\n});\n\nconst style = document.createElement('style');\nstyle.textContent = `\n  .reveal { opacity: 0; transform: translateY(18px); transition: opacity 0.5s ease, transform 0.5s ease; }\n  .reveal.visible { opacity: 1; transform: translateY(0); }\n`;\ndocument.head.appendChild(style);\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
